[functions.ingest-email]
verify_jwt = false

[functions.ingest-calendar]
verify_jwt = false

[functions.agent-chat]
verify_jwt = true

[functions.extract-from-capture]
verify_jwt = true

[functions.refresh-calendars]
verify_jwt = true

[functions.google-oauth-start]
verify_jwt = true

# Public — Google redirects users here, no JWT possible. Auth via signed
# state parameter set in google-oauth-start.
[functions.google-oauth-callback]
verify_jwt = false

[functions.fetch-calendar-events]
verify_jwt = true

[functions.fetch-gmail-emails]
verify_jwt = true

# Cleo — Sales Agent. JWT required for manual/single/cold modes; scheduled
# mode authenticates via SERVICE_ROLE which is exempt from JWT verify_jwt.
# We keep verify_jwt = false so pg_cron can call without a user JWT; the
# function itself enforces auth per-mode.
[functions.cleo-run]
verify_jwt = false

# Sage — Focus + Inbox Triage Agent. Same auth pattern as Cleo.
[functions.sage-run]
verify_jwt = false

# Ren — Content Agent. Same auth pattern as Cleo.
[functions.ren-run]
verify_jwt = false

# Stripe + LemonSqueezy webhook receiver. Public endpoint, secured by
# provider signature verification using STRIPE_WEBHOOK_SECRET / LS_WEBHOOK_SECRET.
[functions.stripe-webhook]
verify_jwt = false
